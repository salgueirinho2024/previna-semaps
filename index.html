<style>
  :root{
    --bg-dark: #0d1e15;
    --bg-dark2: #17301f;
    --green: #46753b;
    --green-bright: #8db673;
    --amber: #c9963c;
    --amber-dim: #a5772b;
    --cream: #f2e8d5;
    --grid-gray: #93a390;
    --danger: #cf5d44;
    --shadow: 0 12px 34px rgba(5, 12, 8, 0.45);
    --hairline: rgba(242,232,213,0.09);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg-dark);
    overscroll-behavior: none;
  }

  #map {
    position: absolute; inset: 0;
    z-index: 1;
    background: #0b1712;
  }

  /* ---------- Top brand bar ---------- */
  .brandbar{
    position: absolute; top: 0; left: 0; right: 0;
    z-index: 500;
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px 40px 16px;
    background: linear-gradient(180deg, rgba(10,22,15,0.88) 0%, rgba(10,22,15,0.55) 60%, rgba(10,22,15,0) 100%);
    pointer-events: none;
  }
  .brand-mark{
    width: 32px; height: 52px;
    display: flex; align-items: flex-end; justify-content: center;
    flex-shrink: 0;
  }
  .brand-mark img{ width: 100%; height: auto; display: block; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.35)); }
  .brand-text{ color: var(--cream); line-height: 1.15; }
  .brand-text .t1{
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 16.5px; letter-spacing: 0.1px;
  }
  .brand-text .t2{
    font-size: 10.5px; color: var(--grid-gray); font-weight: 500; letter-spacing: 0.6px;
    text-transform: uppercase;
  }

  /* ---------- Search panel ---------- */
  .search-wrap{
    position: absolute; top: 14px; left: 0; right: 0;
    z-index: 600;
    display: flex; justify-content: center;
    padding: 0 14px;
  }
  .search-card{
    width: 100%; max-width: 420px;
    margin-top: 62px;
    background-color: rgba(19, 40, 26, 0.93);
    background-image:
      linear-gradient(rgba(242,232,213,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(242,232,213,0.035) 1px, transparent 1px);
    background-size: 22px 22px;
    backdrop-filter: blur(10px);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .search-row{
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
  }
  .search-row svg{ flex-shrink: 0; opacity: 0.65; }
  #searchInput{
    flex: 1; min-width: 0;
    background: transparent; border: none; outline: none;
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    font-size: 16px; font-weight: 500;
    letter-spacing: 0.2px;
  }
  #searchInput::placeholder{ color: rgba(244,242,234,0.4); font-weight: 400; }
  .clear-btn{
    background: none; border: none; color: var(--grid-gray); cursor: pointer;
    padding: 4px; display: none; flex-shrink: 0;
  }
  .clear-btn.show{ display: flex; }

  .results-list{
    max-height: min(360px, 50vh);
    overflow-y: auto;
    border-top: 1px solid var(--hairline);
    display: none;
  }
  .results-list.show{ display: block; }
  .result-item{
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px;
    cursor: pointer;
    border-bottom: 1px dashed var(--hairline);
    transition: background 0.12s ease;
  }
  .result-item:last-child{ border-bottom: none; }
  .result-item:hover, .result-item.active{ background: rgba(141,182,115,0.13); }
  .result-swatch{
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green-bright); flex-shrink: 0;
    box-shadow: 0 0 0 3px rgba(141,182,115,0.15);
  }
  .result-main{ flex: 1; min-width: 0; }
  .result-name{
    color: var(--cream); font-size: 13.5px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .result-sub{
    color: var(--grid-gray); font-size: 11px; margin-top: 2px;
    font-family: 'JetBrains Mono', monospace; letter-spacing: 0.2px;
  }
  .result-plots{
    font-size: 9.5px; color: var(--amber); font-family: 'JetBrains Mono', monospace;
    background: rgba(201,150,60,0.13); border: 1px solid rgba(201,150,60,0.3);
    padding: 2px 7px; border-radius: 20px; letter-spacing: 0.2px;
    flex-shrink: 0;
  }
  .no-results{
    padding: 22px 14px; text-align: center; color: var(--grid-gray); font-size: 13px;
  }

  /* ---------- Layer toggle + locate ---------- */
  .fab-col{
    position: absolute; right: 14px; bottom: 14px;
    z-index: 500;
    display: flex; flex-direction: column; gap: 10px;
    align-items: flex-end;
  }
  .fab{
    width: 44px; height: 44px; border-radius: 12px;
    background: rgba(19, 40, 26, 0.93);
    border: 1px solid var(--hairline);
    box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--cream);
    backdrop-filter: blur(10px);
  }
  .fab:active{ transform: scale(0.94); }
  .fab.active{ background: var(--green); color: #fff; }

  /* ---------- Info panel (bottom sheet) ---------- */
  .info-panel{
    position: absolute; left: 0; right: 0; bottom: 0;
    z-index: 700;
    background-color: rgba(17, 36, 24, 0.98);
    background-image:
      linear-gradient(rgba(242,232,213,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(242,232,213,0.03) 1px, transparent 1px);
    background-size: 22px 22px;
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--hairline);
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -12px 34px rgba(5,12,8,0.5);
    padding: 10px 20px 22px 20px;
    transform: translateY(105%);
    transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    max-height: 62vh;
    overflow-y: auto;
  }
  .info-panel.show{ transform: translateY(0); }
  .sheet-handle{
    width: 36px; height: 4px; border-radius: 4px;
    background: rgba(255,255,255,0.18);
    margin: 2px auto 14px auto;
  }
  .info-close{
    position: absolute; top: 14px; right: 16px;
    background: none; border: none; color: var(--grid-gray); cursor: pointer;
    padding: 4px;
  }
  .info-eyebrow{
    display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
  }
  .grid-badge{
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600;
    color: var(--amber); background: rgba(201,150,60,0.13);
    border: 1px solid rgba(201,150,60,0.28);
    padding: 3px 8px 3px 7px; border-radius: 4px; letter-spacing: 0.6px;
  }
  .code-badge{
    font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600;
    color: var(--green-bright); letter-spacing: 0.4px;
    border-left: 2px dashed rgba(141,182,115,0.5);
    padding-left: 8px;
  }
  .info-name{
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 23px;
    color: var(--cream); line-height: 1.22; margin: 8px 0 14px 0;
  }
  .plot-list{ display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .plot-item{
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(242,232,213,0.035);
    border: 1px solid var(--hairline);
    border-radius: 9px; padding: 10px 12px;
    cursor: pointer; transition: background 0.12s;
  }
  .plot-item:hover{ background: rgba(141,182,115,0.12); }
  .plot-item.active-plot{ border-color: var(--green-bright); background: rgba(141,182,115,0.1); }
  .plot-label{ font-size: 12.5px; color: var(--cream); font-weight: 500; }
  .plot-coords{ font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--grid-gray); }
  .action-row{ display: flex; gap: 10px; }
  .btn{
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 13px 14px; border-radius: 11px; border: none; cursor: pointer;
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13.5px;
    text-decoration: none;
  }
  .btn-primary{ background: var(--amber); color: #23180a; }
  .btn-primary:active{ background: var(--amber-dim); }
  .btn-ghost{
    background: rgba(242,232,213,0.05); color: var(--cream);
    border: 1px solid var(--hairline);
  }
  .btn-ghost:active{ background: rgba(242,232,213,0.1); }

  /* ---------- Custom marker + pulse ---------- */
  .farm-pin{
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--green-bright);
    border: 2px solid rgba(13,30,21,0.9);
    box-shadow: 0 0 0 2px rgba(141,182,115,0.35);
  }
  .target-marker{ position: relative; width: 1px; height: 1px; }
  .target-ring{
    position: absolute; top: 50%; left: 50%;
    width: 46px; height: 46px; margin: -23px 0 0 -23px;
    border-radius: 50%; border: 2.5px solid var(--amber);
    animation: pulse-ring 1.6s cubic-bezier(0.2,0.6,0.4,1) infinite;
  }
  .target-dot{
    position: absolute; top: 50%; left: 50%;
    width: 10px; height: 10px; margin: -5px 0 0 -5px;
    border-radius: 50%; background: var(--amber);
    box-shadow: 0 0 0 3px rgba(242,177,52,0.25);
  }
  @keyframes pulse-ring{
    0% { transform: scale(0.35); opacity: 1; }
    75% { transform: scale(1.6); opacity: 0; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  .usina-marker{ position: relative; width: 1px; height: 1px; }
  .usina-ring{
    position: absolute; top: 50%; left: 50%;
    width: 30px; height: 30px; margin: -15px 0 0 -15px;
    border-radius: 50%; border: 1.5px solid rgba(242,232,213,0.35);
  }
  .usina-dot{
    position: absolute; top: 50%; left: 50%;
    width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px;
    background: var(--cream); border: 2px solid #23180a;
    transform: rotate(45deg);
    box-shadow: 0 0 0 3px rgba(242,232,213,0.18);
  }
  .leaflet-tooltip.usina-label{
    background: rgba(17,36,24,0.94);
    color: var(--cream);
    border: 1px solid rgba(242,232,213,0.25);
    border-radius: 5px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.6px;
    padding: 4px 9px;
    box-shadow: var(--shadow);
  }
  .leaflet-tooltip.usina-label::before{ border-top-color: rgba(17,36,24,0.94); }

  .leaflet-popup-content-wrapper{
    background: var(--bg-dark2); color: var(--cream); border-radius: 10px;
    border: 1px solid var(--hairline);
  }
  .leaflet-popup-tip{ background: var(--bg-dark2); }

// group by codigo (a farm can have multiple disjoint plots)
const FARMS = FARMS_RAW.map((f, i) => ({...f, _id: i}));
const byCode = {};
FARMS.forEach(f => {
  if(!byCode[f.codigo]) byCode[f.codigo] = [];
  byCode[f.codigo].push(f);
});
const codes = Object.keys(byCode);

function normalize(s){
  return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}

/* ============ MAP SETUP ============ */
const map = L.map('map', { zoomControl: false, attributionControl: true }).setView([-20.0871, -46.0399], 16);

const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19, attribution: 'Esri, Maxar, Earthstar Geographics'
});
const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
});
satellite.addTo(map);
let usingSatellite = true;

L.control.zoom({ position: 'bottomleft' }).addTo(map);
L.control.scale({ position: 'bottomleft', imperial: false }).addTo(map);

/* ============ MARKERS ============ */
const cluster = L.markerClusterGroup({
  maxClusterRadius: 42,
  iconCreateFunction: function(c){
    const count = c.getChildCount();
    return L.divIcon({
      html: '<span>'+count+'</span>',
      className: 'marker-cluster-custom',
      iconSize: L.point(38, 38)
    });
  }
});

const pinIcon = L.divIcon({ className: 'farm-pin-wrap', html: '<div class="farm-pin"></div>', iconSize: [14,14], iconAnchor: [7,7], popupAnchor: [0,-10] });

const markerById = {};
FARMS.forEach(f => {
  const m = L.marker([f.lat, f.lng], { icon: pinIcon });
  m.bindPopup('<b>'+escapeHtml(f.nome)+'</b><br>Fazenda nº '+escapeHtml(f.codigo)+(f.quadricula ? ' · Quadrícula '+escapeHtml(f.quadricula) : ''));
  m.on('click', () => selectFarm(f.codigo, f._id));
  markerById[f._id] = m;
  cluster.addLayer(m);
});
map.addLayer(cluster);

/* ============ USINA (SEDE) ============ */
const usinaIcon = L.divIcon({
  className: 'usina-marker-wrap',
  html: '<div class="usina-marker"><div class="usina-ring"></div><div class="usina-dot"></div></div>',
  iconSize: [1,1], iconAnchor: [0,0]
});
L.marker([-20.0871, -46.0399], { icon: usinaIcon, zIndexOffset: 900 })
  .addTo(map)
  .bindPopup('<b>Bambuí Bioenergia S/A</b><br>Usina · sede')
  .bindTooltip('BAMBUÍ BIOENERGIA S/A', {
    permanent: true,
    direction: 'top',
    offset: [0, -14],
    className: 'usina-label'
  });

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============ TARGET HIGHLIGHT ============ */
let targetMarker = null;
function showTarget(lat, lng){
  if(targetMarker) map.removeLayer(targetMarker);
  const icon = L.divIcon({
    className: 'target-marker-wrap',
    html: '<div class="target-marker"><div class="target-ring"></div><div class="target-dot"></div></div>',
    iconSize: [1,1], iconAnchor: [0,0]
  });
  targetMarker = L.marker([lat, lng], { icon, zIndexOffset: 1000, interactive: false }).addTo(map);
}
function clearTarget(){
  if(targetMarker){ map.removeLayer(targetMarker); targetMarker = null; }
}

/* ============ SEARCH ============ */
const searchInput = document.getElementById('searchInput');
const resultsList = document.getElementById('resultsList');
const clearBtn = document.getElementById('clearBtn');
let activeIndex = -1;
let currentMatches = [];

function getMatches(query){
  const q = normalize(query.trim());
  if(!q) return [];
  const scored = [];
  codes.forEach(code => {
    const group = byCode[code];
    const f = group[0];
    const codeNorm = code.toLowerCase();
    const nameNorm = normalize(f.nome);
    let score = -1;
    if(codeNorm === q) score = 100;
    else if(codeNorm.startsWith(q)) score = 90;
    else if(nameNorm.startsWith(q)) score = 70;
    else if(codeNorm.includes(q)) score = 50;
    else if(nameNorm.includes(q)) score = 40;
    if(score > 0) scored.push({ code, f, group, score });
  });
  scored.sort((a,b) => b.score - a.score || a.code.localeCompare(b.code, undefined, {numeric:true}));
  return scored.slice(0, 30);
}

function renderResults(matches){
  currentMatches = matches;
  activeIndex = -1;
  if(matches.length === 0){
    resultsList.innerHTML = '<div class="no-results">Nenhuma fazenda encontrada</div>';
    resultsList.classList.add('show');
    return;
  }
  resultsList.innerHTML = matches.map((m, i) => `
    <div class="result-item" data-idx="${i}">
      <div class="result-swatch"></div>
      <div class="result-main">
        <div class="result-name">${escapeHtml(m.f.nome)}</div>
        <div class="result-sub">Fazenda nº ${escapeHtml(m.code)}${m.f.quadricula ? ' · '+escapeHtml(m.f.quadricula) : ''}</div>
      </div>
      ${m.group.length > 1 ? '<div class="result-plots">'+m.group.length+' áreas</div>' : ''}
    </div>
  `).join('');
  resultsList.classList.add('show');
  resultsList.querySelectorAll('.result-item').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx);
      const m = currentMatches[idx];
      selectFarm(m.code);
    });
  });
}

searchInput.addEventListener('input', () => {
  const val = searchInput.value;
  clearBtn.classList.toggle('show', val.length > 0);
  const matches = getMatches(val);
  if(val.trim().length === 0){
    resultsList.classList.remove('show');
    return;
  }
  renderResults(matches);
});

searchInput.addEventListener('keydown', (e) => {
  const items = resultsList.querySelectorAll('.result-item');
  if(e.key === 'ArrowDown'){
    e.preventDefault();
    activeIndex = Math.min(activeIndex+1, items.length-1);
    updateActive(items);
  } else if(e.key === 'ArrowUp'){
    e.preventDefault();
    activeIndex = Math.max(activeIndex-1, 0);
    updateActive(items);
  } else if(e.key === 'Enter'){
    e.preventDefault();
    const pick = activeIndex >= 0 ? currentMatches[activeIndex] : currentMatches[0];
    if(pick) selectFarm(pick.code);
  } else if(e.key === 'Escape'){
    clearSearch();
  }
});

function updateActive(items){
  items.forEach((el,i) => el.classList.toggle('active', i === activeIndex));
  if(activeIndex >= 0) items[activeIndex].scrollIntoView({ block: 'nearest' });
}

clearBtn.addEventListener('click', clearSearch);
function clearSearch(){
  searchInput.value = '';
  clearBtn.classList.remove('show');
  resultsList.classList.remove('show');
  searchInput.focus();
}

/* ============ SELECT FARM / INFO PANEL ============ */
const infoPanel = document.getElementById('infoPanel');
const infoCode = document.getElementById('infoCode');
const infoGrid = document.getElementById('infoGrid');
const infoName = document.getElementById('infoName');
const plotList = document.getElementById('plotList');
const routeBtn = document.getElementById('routeBtn');
const copyBtn = document.getElementById('copyBtn');

let activePlotId = null;

function selectFarm(code, preferredId){
  const group = byCode[code];
  if(!group) return;
  resultsList.classList.remove('show');

  const first = group[0];
  infoCode.textContent = 'Fazenda nº ' + code;
  infoName.textContent = first.nome;
  if(first.quadricula){
    infoGrid.style.display = 'inline-block';
    infoGrid.textContent = 'QUADRÍCULA ' + first.quadricula;
  } else {
    infoGrid.style.display = 'none';
  }

  plotList.innerHTML = group.map((f, i) => `
    <div class="plot-item" data-id="${f._id}">
      <span class="plot-label">${group.length > 1 ? 'Área '+(i+1) : 'Localização'}</span>
      <span class="plot-coords">${f.lat.toFixed(5)}, ${f.lng.toFixed(5)}</span>
    </div>
  `).join('');
  plotList.querySelectorAll('.plot-item').forEach(el => {
    el.addEventListener('click', () => focusPlot(parseInt(el.dataset.id), true));
  });

  const target = preferredId !== undefined ? group.find(f => f._id === preferredId) : group[0];
  focusPlot(target._id, false);

  if(preferredId !== undefined){
    // triggered by a direct marker tap — go straight to that specific point
    map.flyTo([target.lat, target.lng], Math.max(map.getZoom(), 16), { duration: 0.7 });
  } else if(group.length > 1){
    // triggered by search — show all plots belonging to this farm
    const bounds = L.latLngBounds(group.map(f => [f.lat, f.lng]));
    map.flyToBounds(bounds, { padding: [90,90], maxZoom: 15, duration: 0.9 });
  } else {
    map.flyTo([target.lat, target.lng], 16, { duration: 0.9 });
  }

  infoPanel.classList.add('show');
}

function focusPlot(id, doFly){
  const f = FARMS.find(x => x._id === id);
  activePlotId = id;
  plotList.querySelectorAll('.plot-item').forEach(el => {
    el.classList.toggle('active-plot', parseInt(el.dataset.id) === id);
  });
  showTarget(f.lat, f.lng);
  routeBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${f.lat},${f.lng}&travelmode=driving`;
  copyBtn.dataset.coords = `${f.lat}, ${f.lng}`;
  if(doFly) map.flyTo([f.lat, f.lng], Math.max(map.getZoom(), 16), { duration: 0.7 });
  const m = markerById[id];
  if(m) setTimeout(() => m.openPopup(), doFly ? 700 : 900);
}

copyBtn.addEventListener('click', () => {
  const coords = copyBtn.dataset.coords || '';
  navigator.clipboard?.writeText(coords).then(() => {
    const original = copyBtn.innerHTML;
    copyBtn.innerHTML = '<span>Copiado ✓</span>';
    setTimeout(() => copyBtn.innerHTML = original, 1400);
  });
});

document.getElementById('infoClose').addEventListener('click', () => {
  infoPanel.classList.remove('show');
  clearTarget();
});

/* ============ LAYER TOGGLE ============ */
document.getElementById('layerBtn').addEventListener('click', () => {
  if(usingSatellite){
    map.removeLayer(satellite);
    streets.addTo(map);
  } else {
    map.removeLayer(streets);
    satellite.addTo(map);
  }
  usingSatellite = !usingSatellite;
});

/* ============ LOCATE ============ */
const locateBtn = document.getElementById('locateBtn');
locateBtn.addEventListener('click', () => {
  if(!navigator.geolocation) return;
  locateBtn.classList.add('active');
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude, longitude } = pos.coords;
    map.flyTo([latitude, longitude], 14, { duration: 0.8 });
    L.circleMarker([latitude, longitude], {
      radius: 8, color: '#4c9aff', weight: 2, fillColor: '#4c9aff', fillOpacity: 0.5
    }).addTo(map);
    setTimeout(() => locateBtn.classList.remove('active'), 1500);
  }, () => { locateBtn.classList.remove('active'); }, { enableHighAccuracy: true, timeout: 8000 });
});

/* click outside to collapse results */
document.addEventListener('click', (e) => {
  if(!e.target.closest('.search-card')){
    resultsList.classList.remove('show');
  }
});

/* ============ PWA / OFFLINE ============ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .then((reg) => console.log('[SW] Registrado', reg.scope))
      .catch((err) => console.warn('[SW] Falha ao registrar', err));
  });
}
</script>
